name: Checks

# Tests for pull requests into main and every push to main. The app is deployed to the
# server with deploy/server/update.sh; nothing here publishes anything.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

# uv runs on the interpreter from actions/setup-python (the one the sidecar
# builds were proven with), never a uv-managed download.
env:
  UV_PYTHON: '3.12'
  UV_PYTHON_PREFERENCE: only-system

jobs:
  quality:
    name: Quality checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      # tests/test_dependency_lock.py also fails if requirements.txt (the pip
      # fallback for source-mode machines) is not the export of uv.lock.
      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Install browser test runtime
        run: uv run --locked playwright install chromium

      - name: Run Python tests
        run: uv run --locked pytest -q

      - name: Check browser JavaScript syntax
        run: node --check riviu/web/static/app.js
