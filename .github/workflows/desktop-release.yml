name: Desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# uv runs on the interpreter from actions/setup-python (the one the sidecar
# builds were proven with), never a uv-managed download.
env:
  UV_PYTHON: '3.12'
  UV_PYTHON_PREFERENCE: only-system

jobs:
  quality:
    name: Quality checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      # tests/test_dependency_lock.py also fails if requirements.txt (the pip
      # fallback for source-mode machines) is not the export of uv.lock.
      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci

      - name: Install browser test runtime
        run: uv run --locked playwright install chromium

      - name: Run Python tests
        run: uv run --locked pytest -q

      - name: Check browser JavaScript syntax
        run: node --check riviu/web/static/app.js

  prepare-release:
    name: Prepare GitHub release
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          tag="v${VERSION}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Riviu Reports $tag" --generate-notes --draft
          release_id="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERT_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_DATA: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD_VALUE: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZE_ID: ${{ secrets.APPLE_ID }}
      APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_NOTARIZE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_DATA != ''
        uses: apple-actions/import-codesign-certs@v3
        env:
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE_DATA }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD_VALUE }}
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE_DATA }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD_VALUE }}

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install desktop dependencies
        run: npm ci

      - name: Set release version
        run: npm run desktop:version -- ${{ needs.prepare-release.outputs.version }}

      - name: Build bundled server
        run: uv run --locked python desktop/build_sidecar.py --target ${{ matrix.target }}

      - name: Smoke-test bundled server
        run: uv run --locked python desktop/smoke_sidecar.py --target ${{ matrix.target }}

      - name: Build installers and publish updater artifacts (unsigned)
        if: runner.os != 'macOS' || env.APPLE_CERT_IDENTITY == ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: .
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseName: Riviu Reports ${{ needs.prepare-release.outputs.tag }}
          releaseBody: Automated Riviu Reports desktop build.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build installers and publish updater artifacts (signed)
        if: runner.os == 'macOS' && env.APPLE_CERT_IDENTITY != ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_CERT_IDENTITY }}
          APPLE_ID: ${{ env.APPLE_NOTARIZE_ID }}
          APPLE_PASSWORD: ${{ env.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ env.APPLE_NOTARIZE_TEAM }}
        with:
          projectPath: .
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseName: Riviu Reports ${{ needs.prepare-release.outputs.tag }}
          releaseBody: Automated Riviu Reports desktop build.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  publish-release:
    name: Publish completed release
    needs:
      - prepare-release
      - build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish updater release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
