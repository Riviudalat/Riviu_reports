[package]
name = "riviu-reports"
version = "0.1.0"
description = "Riviu Reports desktop application"
authors = ["Riviu Reports"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "riviu_reports_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.5" }
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
serde_json = "1.0.149"
url = "2.5.7"
