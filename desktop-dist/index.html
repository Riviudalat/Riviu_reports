<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riviu Reports</title>
  <style>
    :root { color: #172033; background: #f3f6f9; font-family: Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(420px, calc(100vw - 48px)); text-align: center; }
    img { width: 148px; height: auto; }
    h1 { margin: 18px 0 8px; font-size: 24px; }
    p { margin: 0; color: #64748b; font-size: 14px; }
    .bar { height: 4px; margin-top: 22px; overflow: hidden; border-radius: 999px; background: #e2e8f0; }
    .bar::before { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: #ff6b00; animation: load 1.1s ease-in-out infinite alternate; }
    @keyframes load { to { transform: translateX(140%); } }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Riviu">
    <h1>Riviu Reports</h1>
    <p>Đang khởi động dữ liệu cục bộ...</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
</body>
</html>
