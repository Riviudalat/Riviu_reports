[project]
name = "riviu-reports"
version = "0.1.0"
description = "Riviu Reports: local FastAPI app that scans TikTok and Threads metrics into partner workbooks."
readme = "AGENTS.md"
# CI tests and builds on 3.12. setup.bat finds 3.11-3.14, and the suite passes on
# 3.11 and 3.14. 3.15 is excluded until the binary dependencies ship wheels for it.
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.100.0,<0.112.0",
    "uvicorn[standard]>=0.23.0",
    "starlette>=0.28.0,<0.39.0",
    "playwright==1.59.0",
    "openpyxl>=3.1.2",
    "Pillow>=10.0.0",
    "pandas>=2.1.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.9",
    "google-api-python-client>=2.151.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "PySocks>=1.7.1",
    "keyring>=25.6,<26; sys_platform != 'win32'",
    # cryptography 49+ ships no macOS x86_64 wheel; pip then builds it against Homebrew
    # OpenSSL, and the frozen sidecar crashes on import (libssl clash with Python's own).
    "cryptography>=46,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
# Tests and the desktop sidecar build. Not installed by setup.bat / capnhat.bat
# (`uv sync --no-dev`) and not in requirements.txt.
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.12,<7",
]

[tool.uv]
# An application run from the repository root (`python -m riviu`, `app.py`), not a
# library: uv installs only the dependencies, never the project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
