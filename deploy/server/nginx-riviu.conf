# /etc/nginx/sites-available/riviu  ->  ln -s into sites-enabled, then `nginx -t && systemctl reload nginx`.
# TLS terminates here; the app listens only on 127.0.0.1:18110 (deploy/server/compose.yaml).
# The 443 listener binds the LAN IP like the other sites on this host: Tailscale already
# holds wildcard :443 binds, so `listen 443` would clash.

map $http_upgrade $riviu_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 113-161-254-76.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 192.168.2.5:443 ssl;
    server_name 113-161-254-76.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/113-161-254-76.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/113-161-254-76.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:riviu_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Workbook uploads.
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # $remote_addr, not $proxy_add_x_forwarded_for: a client cannot prepend a fake IP
    # to dodge the login rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $riviu_connection_upgrade;
    # Keep every proxy_set_header at this level: one inside a location would drop all of
    # the above for it, and the app would see Host 127.0.0.1:18110 and no client IP.

    # Scan progress WebSocket: a scan can run for a long time between messages.
    location = /ws {
        proxy_pass http://127.0.0.1:18110;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:18110;
        # Google sync, exports and pushes can take a few minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
